{% load static %}
<header class="bg-black text-white shadow-lg border-b border-neutral-900 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <!-- Logo -->
            <div class="text-2xl font-extrabold tracking-tight text-white">
                <span class="text-neutral-500">Game</span>Wear
            </div>

            <!-- Navigation Links -->
            <nav class="hidden md:flex space-x-8">
                <a href="#" class="text-neutral-400 hover:text-white transition duration-200 font-medium">Home</a>
                <a href="#" class="text-neutral-400 hover:text-white transition duration-200 font-medium">Contact</a>
                <a href="#" class="text-neutral-400 hover:text-white transition duration-200 font-medium">About Us</a>
            </nav>

            <!-- Actions (Cart, Account, Login) -->
            <div class="flex items-center space-x-4">
                <!-- ✦ Favourite Icon -->
      <a href="#" class="relative group text-neutral-400 hover:text-white transition duration-200" aria-label="Wishlist">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
        <!-- Badge (optional: show count) -->
        {% if wishlist_count and wishlist_count > 0 %}
          <span class="absolute -top-1.5 -right-1.5 bg-white text-black text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center leading-none">
            {{ wishlist_count }}
          </span>
        {% endif %}
      </a>
                <!-- ✦ Cart Icon -->
      <a href="{% url 'products:cart_view' %}" class="relative group text-neutral-400 hover:text-white transition duration-200" aria-label="Cart">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
          <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="1.8" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 10a4 4 0 0 1-8 0" />
        </svg>
        <!-- Badge -->
        {% if cart_count and cart_count > 0 %}
          <span class="absolute -top-1.5 -right-1.5 bg-white text-black text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center leading-none">
            {{ cart_count }}
          </span>
        {% endif %}
      </a>
                <!-- Login Button -->
                <a href="{% url 'users:login' %}"
                    class="bg-white text-black px-4 py-2 rounded-lg font-semibold hover:bg-neutral-200 transition duration-200 shadow-md">
                    Login
                </a>
            </div>
        </div>
    </header>
