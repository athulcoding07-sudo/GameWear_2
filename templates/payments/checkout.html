<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
  .pay-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .pay-card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 2rem 2.5rem;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .brand-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .brand-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #f3f4f6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }

  .brand-name {
    font-size: 18px;
    font-weight: 600;
    color: #111;
  }

  .divider {
    border: none;
    border-top: 1px solid #f0f0f0;
    margin: 0 0 1.5rem;
  }

  .amount-label {
    font-size: 13px;
    color: #6b7280;
    margin: 0 0 4px;
  }

  .amount-value {
    font-size: 28px;
    font-weight: 600;
    color: #111;
    margin: 0 0 4px;
  }

  .order-ref {
    font-size: 12px;
    color: #9ca3af;
    margin: 0 0 1.75rem;
    letter-spacing: 0.02em;
  }

  #pay-btn {
    width: 100%;
    padding: 13px;
    background: #2563EB;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s, transform 0.12s;
  }

  #pay-btn:hover  { opacity: 0.92; }
  #pay-btn:active { transform: scale(0.98); }

  .secure-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 1rem;
    font-size: 12px;
    color: #9ca3af;
  }

  .methods {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 1.25rem;
    flex-wrap: wrap;
  }

  .method-pill {
    font-size: 11px;
    color: #6b7280;
    background: #f3f4f6;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    padding: 3px 10px;
  }
</style>

<div class="pay-wrapper">
  <div class="pay-card">

    <div class="brand-row">
      <div class="brand-icon">🎮</div>
      <span class="brand-name">GameWear</span>
    </div>

    <hr class="divider">

    <p class="amount-label">Order total</p>
    <p class="amount-value">₹ {{ payment.raw_response.amount | floatformat:"-2" }}</p>
    <p class="order-ref">Order #{{ payment.razorpay_order_id }}</p>

    <button id="pay-btn">
      🔒 Pay securely
    </button>

    <div class="secure-row">
      🛡️ Secured by Razorpay · 256-bit SSL
    </div>

    <div class="methods">
      <span class="method-pill">UPI</span>
      <span class="method-pill">Cards</span>
      <span class="method-pill">Net banking</span>
      <span class="method-pill">Wallets</span>
    </div>

  </div>
</div>

<script>
  const options = {
    key: "{{ razorpay_key_id }}",
    amount: "{{ payment.raw_response.amount }}",
    currency: "INR",
    name: "GameWear",
    description: "Order Payment",
    order_id: "{{ payment.razorpay_order_id }}",
    handler: function (response) {
      fetch("/payments/verify/", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}"
        },
        body: JSON.stringify({
          razorpay_order_id: response.razorpay_order_id,
          razorpay_payment_id: response.razorpay_payment_id,
          razorpay_signature: response.razorpay_signature
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message === "Payment Successful") {
          window.location.href = `/products/success/${data.order_id}/`;
        } else {
          alert("Payment verification failed");
        }
      });
    }
  };

  const rzp = new Razorpay(options);
  document.getElementById("pay-btn").onclick = function (e) {
    rzp.open();
    e.preventDefault();
  };
</script>
